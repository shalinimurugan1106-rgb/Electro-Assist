<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resistor Color Code Calculator</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<nav class="navbar">
     <div class="logo">
    <img src="images/navbar-logo.svg" alt="ElectroAssist Logo">
    <span>ElectroAssist</span>
</div>

    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
    </ul>
</nav>

<section class="calculator">

<h1>Resistor Color Code Calculator</h1>

<div class="box">

<label>Band 1</label><br>
<select id="band1">
<option value="0">Black</option>
<option value="1">Brown</option>
<option value="2">Red</option>
<option value="3">Orange</option>
<option value="4">Yellow</option>
<option value="5">Green</option>
<option value="6">Blue</option>
<option value="7">Violet</option>
<option value="8">Grey</option>
<option value="9">White</option>
</select>

<br><br>

<label>Band 2</label><br>
<select id="band2">
<option value="0">Black</option>
<option value="1">Brown</option>
<option value="2">Red</option>
<option value="3">Orange</option>
<option value="4">Yellow</option>
<option value="5">Green</option>
<option value="6">Blue</option>
<option value="7">Violet</option>
<option value="8">Grey</option>
<option value="9">White</option>
</select>

<br><br>

<label>Multiplier</label><br>
<select id="multiplier">
<option value="1">Black ×1</option>
<option value="10">Brown ×10</option>
<option value="100">Red ×100</option>
<option value="1000">Orange ×1K</option>
<option value="10000">Yellow ×10K</option>
<option value="100000">Green ×100K</option>
<option value="1000000">Blue ×1M</option>
</select>

<br><br>

<button onclick="calculateResistor()">Calculate</button>
<button onclick="clearResistor()">Clear</button>

<h2 id="result"></h2>

</div>

</section>

<script src="resistor.js"></script>

</body>
</html>
