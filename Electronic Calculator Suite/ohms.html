<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohm's Law Calculator</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ohms.css">

</head>

<body>

<nav class="navbar">

<div class="logo">
    <img src="images/navbar-logo.svg" alt="ElectroAssist Logo">
    <span>ElectroAssist</span>
</div>

<ul class="nav-links">

<section class="calculator">

<h1>Ohm's Law Calculator</h1>

<p>Enter any two values to calculate the third.</p>

<div class="box">

<label>Voltage (V)</label>
<input type="number" id="voltage">

<label>Current (A)</label>
<input type="number" id="current">

<label>Resistance (Ω)</label>
<input type="number" id="resistance">

<button onclick="calculateOhms()">
Calculate
</button>

<button onclick="clearData()">
Clear
</button>

<h2 id="result"></h2>

</div>

</section>

<script src="ohms.js"></script>

</body>
