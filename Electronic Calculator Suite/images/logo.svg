<svg xmlns="http://www.w3.org/2000/svg" width="520" height="140" viewBox="0 0 520 140">

<defs>

<linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#1565C0"/>
<stop offset="100%" stop-color="#00C853"/>
</linearGradient>

<linearGradient id="board" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#2196F3"/>
<stop offset="100%" stop-color="#0D47A1"/>
</linearGradient>

</defs>

<!-- PCB Lines -->

<line x1="20" y1="35" x2="75" y2="35" stroke="#1565C0" stroke-width="4"/>
<circle cx="20" cy="35" r="4" fill="#1565C0"/>

<line x1="20" y1="105" x2="75" y2="105" stroke="#00C853" stroke-width="4"/>
<circle cx="20" cy="105" r="4" fill="#00C853"/>

<!-- Resistor -->

<polyline
points="75,35 85,25 95,45 105,25 115,45 125,25 135,35"
fill="none"
stroke="#F9A825"
stroke-width="4"/>

<!-- Arduino Board -->

<rect
x="150"
y="18"
width="110"
height="80"
rx="10"
fill="url(#board)"
stroke="#0D47A1"
stroke-width="2"/>

<rect
x="160"
y="28"
width="18"
height="8"
fill="white"/>

<rect
x="235"
y="28"
width="15"
height="8"
fill="white"/>

<rect
x="180"
y="60"
width="50"
height="18"
fill="#1B1B1B"/>

<text
x="183"
y="52"
font-size="18"
font-family="Arial"
fill="white"
font-weight="bold">
UNO
</text>

<!-- Capacitor -->

<line x1="285" y1="28" x2="285" y2="82" stroke="#424242" stroke-width="4"/>

<line x1="295" y1="28" x2="295" y2="82" stroke="#424242" stroke-width="4"/>

<line x1="290" y1="82" x2="290" y2="100" stroke="#424242" stroke-width="3"/>

<!-- IC Chip -->

<rect
x="325"
y="28"
width="55"
height="55"
rx="6"
fill="#212121"/>

<g stroke="#9E9E9E" stroke-width="2">

<line x1="325" y1="35" x2="315" y2="35"/>
<line x1="325" y1="45" x2="315" y2="45"/>
<line x1="325" y1="55" x2="315" y2="55"/>
<line x1="325" y1="65" x2="315" y2="65"/>
<line x1="325" y1="75" x2="315" y2="75"/>

<line x1="380" y1="35" x2="390" y2="35"/>
<line x1="380" y1="45" x2="390" y2="45"/>
<line x1="380" y1="55" x2="390" y2="55"/>
<line x1="380" y1="65" x2="390" y2="65"/>
<line x1="380" y1="75" x2="390" y2="75"/>

</g>

<!-- Circuit -->

<line x1="390" y1="55" x2="440" y2="55" stroke="#00C853" stroke-width="4"/>

<circle cx="440" cy="55" r="5" fill="#00C853"/>

<!-- Lightning -->

<polygon
points="215,100 205,120 220,120 210,138 240,108 223,108"
fill="#FFC107"/>

<!-- Text -->

<text
x="18"
y="132"
font-size="46"
font-family="Segoe UI"
font-weight="bold"
fill="url(#gradText)">
ElectroAssist
</text>

<text
x="300"
y="128"
font-size="13"
font-family="Segoe UI"
fill="#555">
CALCULATE • ANALYZE • TROUBLESHOOT
</text>

</svg>