<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">

  <!-- PCB -->
  <rect x="12" y="12" width="40" height="40" rx="6"
        fill="#1565C0"/>

  <!-- Circuit traces -->
  <line x1="20" y1="20" x2="32" y2="20"
        stroke="white" stroke-width="2"/>
  <line x1="32" y1="20" x2="32" y2="44"
        stroke="white" stroke-width="2"/>
  <line x1="32" y1="44" x2="44" y2="44"
        stroke="white" stroke-width="2"/>

  <!-- Nodes -->
  <circle cx="20" cy="20" r="2.5" fill="#00C853"/>
  <circle cx="32" cy="20" r="2.5" fill="#00C853"/>
  <circle cx="32" cy="44" r="2.5" fill="#00C853"/>
  <circle cx="44" cy="44" r="2.5" fill="#00C853"/>

  <!-- Lightning -->
  <polygon points="28,26 36,26 31,35 37,35 26,49 30,38 24,38"
           fill="#FFC107"/>

</svg>