<section class="calculator">

<h1>Voltage Divider Calculator</h1>

<p>Calculate the output voltage of a voltage divider.</p>

<div class="box">

<label>Input Voltage (Vin)</label><br>
<input type="number" id="vin"><br><br>

<label>Resistor R1 (Ω)</label><br>
<input type="number" id="r1"><br><br>

<label>Resistor R2 (Ω)</label><br>
<input type="number" id="r2"><br><br>

<button onclick="calculateDivider()">Calculate</button>

<button onclick="clearDivider()">Clear</button>
