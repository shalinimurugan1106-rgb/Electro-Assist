<section class="calculator">

<h1>Voltage Drop Calculator</h1>

<p>Calculate voltage drop across a resistor or conductor.</p>

<div class="box">

<label>Current (A)</label>

<br><br>

<input type="number" id="current">

<br><br>

<label>Resistance (Ω)</label>

<br><br>

<input type="number" id="resistance">

<br><br>

<button onclick="calculateVoltageDrop()">

Calculate

</button>

<button onclick="clearVoltageDrop()">

Clear

</button>

<h2 id="result"></h2>

</div>
